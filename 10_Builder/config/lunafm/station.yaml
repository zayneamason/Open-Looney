station:
  name: LunaFM
  version: 0.1.0
  mode: always
  budget:
    max_concurrent_channels: 2
    max_gpu_pct: 30
    conversation_preempts: true
    preempt_grace_ms: 500
    cooldown_after_conversation_ms: 3000
  default_model:
    provider: ollama
    model: qwen3.5:9b
    max_tokens: 512
    temperature: 0.7
  trust:
    default_lock_in: 0.15
    max_lock_in: 0.5
    source_tag: lunafm
    requires_confirmation: false
    decay_rate: 0.02
    promotion_on_access: 0.1
  targets:
    memory_matrix:
      enabled: true
      node_types:
      - INSIGHT
      - SYNTHESIS
      - CONNECTION
      - CONSOLIDATION
      - FLAG
      max_nodes_per_hour: 45
    revolving_context:
      enabled: true
      ring: OUTER
      max_items: 5
    scribe_mailbox:
      enabled: true
    channel_log:
      enabled: true
      path: data/lunafm/broadcast.log
      max_size_mb: 50
  channels_dir: config/lunafm/channels/
  priority_order:
  - news
  - history
  - entertainment
