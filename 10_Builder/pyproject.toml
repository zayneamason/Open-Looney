[project]
name = "luna-engine"
version = "2.0.0"
description = "Luna's consciousness engine - uses LLMs the way game engines use GPUs"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "anthropic>=0.18.0",
    "httpx>=0.26.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.19.0",
    "networkx>=3.2",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "sqlite-vec>=0.1.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    "watchdog>=4.0.0",
    "simpleeval>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "hypothesis>=6.0.0",
]

memory = [
    "networkx>=3.2",
]

arcade = [
    "pyxel>=2.0.0",
]

providers = [
    "groq>=0.4.0",
    "openai>=1.0.0",
    "google-generativeai>=0.5.0",
]

skills = [
    "markitdown>=0.1.0",
    "pypdf>=4.0.0",
    "sympy>=1.12",
]

cartridge = [
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.0",
]

ocr = [
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]

local = [
    "mlx>=0.5.0",
    "mlx-lm>=0.0.10",
]

voice = [
    "sounddevice>=0.5.0",
    "mlx-whisper>=0.4.0",
    "SpeechRecognition>=3.10.0",
]

# Phase E.9 / F: real-model Lexicon adapters. Operator opt-in.
# After install, run:
#   python -m spacy download en_core_web_sm   (NER)
#   fasttext model auto-downloads on first use (detect_language)
#   toxic-bert + bart-large-mnli download on first pipeline() call
lexicon-models = [
    "spacy>=3.7.0",
    "fasttext-wheel>=0.9.2",
    "transformers>=4.30.0",
    "torch>=2.0.0",
]

hub = [
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "discord.py>=2.3.0",
    "mlx-whisper>=0.4.0 ; platform_machine == 'arm64'",
    "openai-whisper>=20231117 ; platform_machine != 'arm64'",
    "psutil>=5.9.0",
    "pypdf>=4.0.0",
    "sentence-transformers>=2.2.0",
    "fastmcp>=2.0",
]

mcp = [
    "mcp>=1.0.0",
    "httpx>=0.26.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]

ci = [
    "groq>=0.4.0",
    "openai>=1.0.0",
    "google-generativeai>=0.5.0",
    "markitdown>=0.1.0",
    "pypdf>=4.0.0",
    "sympy>=1.12",
    "mcp>=1.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "nuitka>=2.0",
    "ordered-set>=4.1.0",
    "zstandard>=0.22.0",
    "textual>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luna"]

[project.scripts]
luna-debug = "luna.cli.debug:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
