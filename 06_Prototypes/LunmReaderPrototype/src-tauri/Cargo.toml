[package]
name = "lunm-reader"
version = "0.1.0"
description = "Read-only inspector for LUNM runtime matrix files"
authors = ["HeyLuna"]
edition = "2021"

[lib]
name = "lunm_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
