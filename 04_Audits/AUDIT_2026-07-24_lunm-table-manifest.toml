# AUDIT snapshot 2026-07-24 — mirror of Luna Engine
# src/luna/substrate/lunm_table_manifest.toml at merge dd5c3060 (PR #157).
# Source of truth remains in the Engine repo; this file is the dated .lun archive.
#
# SPEC-009: LUNM table ownership manifest
# Static artifact — do not derive from sqlite_master at runtime as the primary source.
# Classifications: format-invariant | engine-extension | conditional | vestigial
# Virtual-table parents only; FTS5/vec0 shadows are derived by the conformance checker.

format_version = 1
spec = "SPEC-009"
notes = "LUNM matrix table ownership. Cartridge/collection DDL (aibrarian_schema, cartridge/*) is out of scope."

# ---------------------------------------------------------------------------
# Format invariants (SPEC-008 §4.3) — only these eight until SPEC-008 amends.
# ---------------------------------------------------------------------------

